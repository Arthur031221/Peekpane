<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peekpane</title><link rel="stylesheet" href="ui.css"></head>
<body><main class="panel"><header><img class="mark" src="../assets/icon.svg" alt=""><div><strong>Peekpane</strong><small>Ask without switching windows</small></div><button id="close" class="icon-button" aria-label="Close panel">×</button></header>
<section class="setup"><label for="key">Anthropic API key</label><div class="key-row"><input id="key" type="password" autocomplete="off" placeholder="sk-ant-…"><button id="save-key">Save</button></div><small>Stored in this browser only. Requests go to Anthropic and are billed to your account.</small></section>
<section><div class="video-wrap"><video id="preview" autoplay muted playsinline></video><div id="selection" aria-hidden="true"></div><span id="video-empty">Choose a screen, window, or tab to share</span></div><div class="controls"><button id="share" class="primary">Choose what to share</button><button id="crop" disabled>Drag a region</button><button id="clear" disabled>Stop</button></div></section>
<section><label for="model">Model</label><select id="model"><option value="claude-sonnet-5">Sonnet</option><option value="claude-opus-5">Opus</option><option value="claude-haiku-4-5-20251001">Haiku</option></select><div class="actions"><button data-prompt="Explain what I am looking at.">What is this?</button><button data-prompt="Translate the visible text into Traditional Chinese. Keep names and code unchanged.">Translate</button><button data-prompt="Summarize the visible information in a few bullets.">Summarize</button><button data-prompt="Inspect this screen for a likely issue and explain what you would check next.">Find an issue</button></div><label for="question">Ask a follow-up</label><textarea id="question" rows="2" placeholder="What would you like to know?"></textarea><button id="ask" class="primary wide" disabled>Ask about this screen</button><div id="status" role="status" aria-live="polite"></div><article id="answer" aria-live="polite"></article></section>
<footer>Capture stays in this panel until you ask. Clear it to stop sharing.</footer></main><script type="module" src="panel.js"></script></body></html>
